name: Renew Spotify refresh token

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  renew:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Exchange authorization code
        id: spotify
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_AUTHORIZATION_CODE: ${{ secrets.SPOTIFY_AUTHORIZATION_CODE }}
          SPOTIFY_REDIRECT_URI: ${{ vars.SPOTIFY_REDIRECT_URI }}
        run: python renew_refresh_token.py

      - name: Replace repository refresh-token secret
        env:
          GH_TOKEN: ${{ secrets.GH_SECRETS_TOKEN }}
          REFRESH_TOKEN: ${{ steps.spotify.outputs.refresh_token }}
        run: printf '%s' "$REFRESH_TOKEN" | gh secret set SPOTIFY_REFRESH_TOKEN --repo "$GITHUB_REPOSITORY"
