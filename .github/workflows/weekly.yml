name: Weekly Python job

on:
  schedule:
    - cron: "25 05 * * 5"   # Every Friday 05:25 UTC
  workflow_dispatch:       # Allows manual run from GitHub UI

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests

      - name: Run script
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
          SPOTIFY_ADEU_PLAYLIST_ID: ${{ vars.SPOTIFY_ADEU_PLAYLIST_ID }}
          SPOTIFY_YENI_PLAYLIST_ID: ${{ vars.SPOTIFY_YENI_PLAYLIST_ID }}
          SPOTIFY_RELEASE_RADAR_PLAYLIST_ID: ${{ vars.SPOTIFY_RELEASE_RADAR_PLAYLIST_ID }}
          SPOTIFY_MASNUEVOS_PLAYLIST_ID: ${{ vars.SPOTIFY_MASNUEVOS_PLAYLIST_ID }}
          SPOTIFY_ULTIMATE_PLAYLIST_ID: ${{ vars.SPOTIFY_ULTIMATE_PLAYLIST_ID }}
          SPOTIFY_EXCLUDED_ARTIST_IDS: ${{ vars.SPOTIFY_EXCLUDED_ARTIST_IDS }}
        run: |
          required=(
            SPOTIFY_CLIENT_ID
            SPOTIFY_CLIENT_SECRET
            SPOTIFY_REFRESH_TOKEN
            SPOTIFY_ADEU_PLAYLIST_ID
            SPOTIFY_YENI_PLAYLIST_ID
            SPOTIFY_RELEASE_RADAR_PLAYLIST_ID
            SPOTIFY_MASNUEVOS_PLAYLIST_ID
            SPOTIFY_ULTIMATE_PLAYLIST_ID
          )
          for name in "${required[@]}"; do
            if [[ -z "${!name}" ]]; then
              echo "::error::${name} is unavailable to this workflow. Check its Actions secret/variable name and scope."
              exit 1
            fi
          done
          python main.py

      - name: Publish Yeni artist and album list
        run: |
          if git diff --quiet -- nuevos.json; then
            echo "nuevos.json is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nuevos.json
          git commit -m "Update nuevos.json"
          git push origin "HEAD:${GITHUB_REF_NAME}"
