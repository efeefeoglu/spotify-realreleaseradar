name: Weekly Python job

on:
  schedule:
    - cron: "25 05 * * 5"   # Every Monday 03:00 UTC
  workflow_dispatch:       # Allows manual run from GitHub UI

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
      SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
      SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
      SPOTIFY_ADEU_PLAYLIST_ID: ${{ vars.SPOTIFY_ADEU_PLAYLIST_ID }}
      SPOTIFY_YENI_PLAYLIST_ID: ${{ vars.SPOTIFY_YENI_PLAYLIST_ID }}
      SPOTIFY_RELEASE_RADAR_PLAYLIST_ID: ${{ vars.SPOTIFY_RELEASE_RADAR_PLAYLIST_ID }}
      SPOTIFY_MASNUEVOS_PLAYLIST_ID: ${{ vars.SPOTIFY_MASNUEVOS_PLAYLIST_ID }}
      SPOTIFY_ULTIMATE_PLAYLIST_ID: ${{ vars.SPOTIFY_ULTIMATE_PLAYLIST_ID }}
      SPOTIFY_EXCLUDED_ARTIST_IDS: ${{ vars.SPOTIFY_EXCLUDED_ARTIST_IDS }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests

      - name: Run script
        run: |
          python main.py
